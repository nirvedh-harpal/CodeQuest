<!DOCTYPE html>
<html>
<head>
    <title>Tag Mapper Test</title>
</head>
<body>
    <h1>Tag Mapper Test</h1>
    <input type="text" id="testInput" placeholder="Type a tag to test..." style="padding: 8px; width: 200px;">
    <div id="result" style="margin: 10px 0; padding: 10px; border: 1px solid #ccc;"></div>
    
    <script>
        // Simple mock for chrome storage
        window.chrome = {
            storage: {
                sync: {
                    get: () => Promise.resolve({}),
                    set: () => Promise.resolve()
                }
            }
        };
    </script>
    <script src="tagMapper.js"></script>
    <script>
        // Initialize tagMapper
        tagMapper.initialize().then(() => {
            console.log("TagMapper initialized");
            
            // Test the normalization
            const testTags = ['dsu', 'DSU', 'dp', 'arrays', 'union-find'];
            console.log("Test results:");
            testTags.forEach(tag => {
                const normalized = tagMapper.normalizeTag(tag);
                console.log(`${tag} -> ${normalized}`);
            });
            
            // Set up input test
            const input = document.getElementById('testInput');
            const result = document.getElementById('result');
            
            input.addEventListener('input', () => {
                const value = input.value.trim();
                if (!value) {
                    result.textContent = '';
                    return;
                }
                
                const normalized = tagMapper.normalizeTag(value);
                const preview = tagMapper.getCanonicalFormPreview(value);
                
                result.innerHTML = `
                    <strong>Input:</strong> "${value}"<br>
                    <strong>Normalized:</strong> "${normalized}"<br>
                    <strong>Preview:</strong> ${preview ? preview.message : 'N/A'}
                `;
            });
        }).catch(error => {
            console.error("TagMapper initialization failed:", error);
        });
    </script>
</body>
</html>
